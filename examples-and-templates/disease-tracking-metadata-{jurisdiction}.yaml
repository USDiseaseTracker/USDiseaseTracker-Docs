# Jurisdiction Reporting Metadata Template
# Version: 1.1.0

# Replace {jurisdiction} with your jurisdiction's two-letter abbreviation
jurisdiction: {jurisdiction}
last_updated: YYYY-MM-DD

# Jurisdiction dashboard, data portal URLs
#  - Replace text after ":" with specific details below for all needed links
#  - Please submit a specifically relevant URL or URLs that you want shared with the public on the USDT dashboard.
urls:
  - name: StateName Measles Dashboard 
    url: www.statedashboardexample.gov
    disease: measles

  - name: StateName Data Portal
    url: www.statedataportal.gov
    disease: all

# Date Classification Method
#   Indicate how cases are classified in time
date_classification_method:
  # Specify if using a custom jurisdiction date hierarchy (true/false)
  custom_date_method: false
  
  # Only complete this if custom_date_method is set to 'true'
  custom_hierarchy_description: >
    Provide detailed description of the custom jurisdiction date hierarchy. 
    Include the order of dates considered (e.g., earliest date, date of onset, lab date, 
    report date) and logic for how cases are classified in time.

# Reported Diseases
#   List all diseases that the jurisdiction will be submitting data for
reported_diseases:
  diseases:
    - measles
    - meningococcus
    - pertussis
  
  notes: >
    Add any additional notes regarding reported diseases

# Substate Jurisdictions
#   List all substate jurisdiction names and counties/planning regions/other defined geographic areas
#   that map to each substate jurisdiction. In the case of each substate jurisdiction being a county, the
#   "counties" list should just be the official county name (exclude the word "County"). Note: the "name" field
#   below is how the jurisdiction will be displayed on the USDT website
#   
#   State naming conventions:
#     - https://phinvads.cdc.gov/vads/ViewValueSet.action?id=80D34BBC-617F-DD11-B38D-00188B398520#
#   
#   County naming conventions:
#     - https://phinvads.cdc.gov/vads/ViewValueSet.action?id=87FD5AB0-2CA3-4070-9FA4-B92D5934E4E7
#
#   Examples:
#     # Example List where substate jurisdictions are counties grouped as health regions
#     # 'name' field is how the substate jurisdiction name will be displayed on the dashboard
#     - name: Knoxville-Knox Region
#       geo_unit: region
#       # 'geographic_areas' is the list of geographic areas that make up the substate jurisdiction. these geographic area
#       # names should match what is stored in Census and ArcGIS data so that population and lat/long centroids can be retrieved.
#       geographic_areas:
#         - Hancock
#         - Hawkins
#         - Greene
#         - Washington
#         - Unicoi
#         - Carter
#         - Johnson
#
#     # Example List where substate jurisdictions are individual health planning regions
#     # 'name' field is how the substate jurisdiction name will be displayed on the dashboard
#     - name: CT Metropolitan
#       geo_unit: region
#       # 'geographic_areas' is the list of geographic areas that make up the substate jurisdiction. these geographic area
#       # names should match what is stored in Census and ArcGIS data so that population and lat/long centroids can be retrieved.
#       geographic_areas:
#         - Greater Bridgeport Planning Region

# List all substate jurisdictions and the counties/regions that make up the jurisdiction
substate_jurisdictions:
  description: Example description - We report at the health region level, which includes 9 health regions each comprised of 3-5 counties.
  
  jurisdictions:
    # 'name' field is how the substate jurisdiction name will be displayed on the dashboard

    # Example 1 - County-level sub-jurisdictions. Here we just list each county. This can be machine generated from a file.      
        # 'name' should match what is stored in Census and ArcGIS data so that population and lat/long centroids can be retrieved.  
        # 'geo_unit' should be the official designation, must match the submitted case data value, and must be consistent across all substate jurisdictions
        # 'geographic_areas' is the list of geographic areas that make up the substate jurisdiction. these geographic area
    - name: Bristol County
      geo_unit: county 
      geographic_areas:
        - Bristol
    
    - name: Dukes/Nantucket/Barnstable Counties
      geo_unit: county 
      geographic_areas:
        - Dukes
        - Nantucket
        - Barnstable
  
  notes: >
    Add any additional notes about naming conventions, or special cases

# Data Suppression Policies
#   Rules and policies for data suppression to protect patient privacy
data_suppression_policies:
  description: Example-Counts are suppressed when counts are 5 and under and the population is less than 100,000.
  url: Link to suppression policies, if applicable, otherwise delete this line, if applicable, otherwise delete this line.

# Data Lag Policies
#   Rules and policies for data lag to protect patient privacy. Description should be detailed, but concise. Include specifics
data_lag_policies:
  description: No data lag is applied.
  url: Link to data lag policies, if applicable, otherwise delete this line.

# Contact Information
#   Provide contact information for technical and data quality questions
contact_information:
  
  # Technical point of contact
  technical_contact:
    name: Technical Contact Name
    title: Position/Title
    organization: Organization/Department
    email: technical.contact@jurisdiction.gov
    phone: XXX-XXX-XXXX
    notes: >
      Primary contact for technical questions about data submission, file formats, 
      transfer methods, etc.
  
  # Data quality contact
  data_quality_contact:
    name: Data Quality Contact Name
    title: Position/Title
    organization: Organization/Department
    email: data.quality@jurisdiction.gov
    phone: XXX-XXX-XXXX
    notes: >
      Primary contact for questions about data quality, validation issues, 
      data definitions, and data interpretation.
  
  # Alternate or backup contact (optional)
  alternate_contact:
    name: Alternate Contact Name (Optional)
    title: Position/Title
    organization: Organization/Department
    email: alternate.contact@jurisdiction.gov
    phone: XXX-XXX-XXXX
    notes: Alternate or backup contact if primary contacts are unavailable.

# Additional Notes
#   Any jurisdiction-specific information or notes
additional_notes:
  jurisdiction_specific_notes: >
    Add any jurisdiction-specific notes, caveats, or additional information that would 
    be helpful for understanding the data submitted by this jurisdiction.
  
  data_quality_notes: >
    Note any known data quality issues, limitations, or special considerations.
  
  update_frequency: weekly
  
  historical_data_availability: >
    Describe the time period for which historical data is available 
    (e.g., 'Data available from December 29, 2024 onwards').
  
  other: Any other relevant information
